[package]
name = "ruwrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["yolezz"]
description = "Inspect and rewrite compiled Rust executables: functions, variables, hot patching, transactional commit."
license = "MIT"
readme = "README.md"
repository = "https://github.com/yo-le-zz/ruwrite"
keywords = ["binary", "patch", "rewrite", "elf", "dwarf"]
categories = ["development-tools", "development-tools::debugging"]
exclude = ["/.github", "/playground"]

[workspace]
members = ["playground"]

[dependencies]
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
memchr = "2.8.3"
object = { version = "0.41", default-features = false, features = ["read", "std", "compression"] }
rustc-demangle = "0.1.28"
thiserror = "2.0.21"

