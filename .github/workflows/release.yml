name: Release

# Pousser un tag `vX.Y.Z` (identique à la version de Cargo.toml) crée la release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Validate
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## v$VERSION" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG entry for v$VERSION" >&2; exit 1; }

      - name: Package
        run: git archive --format=zip --prefix="ruwrite-v$VERSION/" -o "ruwrite-v$VERSION.zip" HEAD

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: ruwrite-v${{ env.VERSION }}.zip
