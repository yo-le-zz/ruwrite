[package]
name = "ruwrite-macros"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
authors = ["yolezz"]
description = "Implementation detail of ruwrite: do not depend on this crate directly, use `ruwrite::protect`."
license = "MIT"
repository = "https://github.com/yo-le-zz/ruwrite"
publish = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
