name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (linux x86_64, full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --examples
      - run: cargo test --workspace
      - run: cargo run --example patch_demo

  test-aarch64:
    name: test (linux aarch64, library)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --test multiarch

  build-portable:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Stop Windows Defender from scanning the test's temp files
        # The multiarch tests write tiny hand-built ELF executables to the
        # temp directory and immediately read/rewrite them; real-time
        # scanning can hold a lock on a freshly written executable-looking
        # file for a few seconds (occasionally longer under CI load), which
        # the exclusion alone does not reliably prevent in time. Turning
        # scanning off for this job is simpler and more reliable than
        # racing it with retries alone (still done too, see multiarch.rs).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP","$env:TEMP"
          Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --test multiarch

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib
