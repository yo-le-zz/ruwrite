name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (linux x86_64, full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --examples
      - run: cargo test --workspace
      - run: cargo run --example patch_demo

  test-aarch64:
    name: test (linux aarch64, library)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --test multiarch

  build-portable:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Soften Windows Defender for the test's temp files
        # Best effort only: GitHub's windows-latest image has Tamper
        # Protection on, which can silently keep `Set-MpPreference` from
        # taking effect at all. The actual fix is the retry below; this is
        # free to attempt and occasionally helps, never required.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP","$env:TEMP"
          Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the multi-arch tests
        # A freshly written sample that merely *looks* like an executable
        # (raw ELF bytes, no PE header Windows itself would recognise) can
        # still get a real-time-scan lock on these runners that lasts far
        # longer than any in-process retry budget — minutes, not seconds, on
        # a bad run. Rather than guess a timeout long enough to always cover
        # that, retry the whole test process a few times; `multiarch.rs`'s
        # own in-process retry (see `retry_io`) still handles the common,
        # short-lived case without re-running anything.
        shell: pwsh
        run: |
          $maxAttempts = 4
          for ($i = 1; $i -le $maxAttempts; $i++) {
            cargo test --lib --test multiarch
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i/$maxAttempts failed (exit $LASTEXITCODE); retrying after a pause..."
            Start-Sleep -Seconds 20
          }
          exit 1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib
