name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (linux x86_64, full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --examples
      - run: cargo test --workspace
      - run: cargo run --example patch_demo

  test-aarch64:
    name: test (linux aarch64, library)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --test multiarch

  build-portable:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Soften Windows Defender for the test's temp files
        # Best effort only: GitHub's windows-latest image has Tamper
        # Protection on, which can silently keep `Set-MpPreference` from
        # taking effect at all. `EnableControlledFolderAccess` is the one
        # that actually matters here: real-time scanning only *delays* access
        # to a file, but Controlled Folder Access (ransomware protection)
        # outright refuses to let an unrecognised app replace an *existing*
        # file in a protected folder — which is exactly what `commit()`'s
        # write-then-rename does, and unlike a scan, that refusal never
        # times out on its own.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP","$env:TEMP"
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -EnableControlledFolderAccess Disabled
      - name: Diagnose Defender's effect on a plain temp-file overwrite
        # Independent of ruwrite/cargo entirely: reproduces `commit()`'s
        # write-then-rename with plain PowerShell, so a failure here proves
        # the environment refuses this regardless of what wrote the file,
        # and the settings above show whether the softening step actually
        # applied. Never fails the job; it only leaves a trail in the log
        # for whoever next has to make sense of a repeat failure below.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "--- Get-MpPreference (relevant fields) ---"
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, EnableControlledFolderAccess, ExclusionPath | Format-List
          Write-Host "--- manual repro: create, then overwrite-by-rename, a fresh TEMP file ---"
          $probe = Join-Path $env:TEMP "ruwrite-ci-probe.bin"
          $tmp = "$probe.tmp"
          [IO.File]::WriteAllBytes($probe, [byte[]](1, 2, 3, 4))
          try {
            [IO.File]::WriteAllBytes($tmp, [byte[]](5, 6, 7, 8))
            Move-Item -Path $tmp -Destination $probe -Force
            Write-Host "overwrite-by-rename: OK"
          } catch {
            Write-Host "overwrite-by-rename: FAILED: $_"
          }
          Remove-Item $probe, $tmp -ErrorAction SilentlyContinue
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the multi-arch tests
        # A freshly written sample that merely *looks* like an executable
        # (raw ELF bytes, no PE header Windows itself would recognise) can
        # still get a real-time-scan lock on these runners that lasts far
        # longer than any in-process retry budget — minutes, not seconds, on
        # a bad run. Rather than guess a timeout long enough to always cover
        # that, retry the whole test process a few times; `multiarch.rs`'s
        # own in-process retry (see `retry_io`) still handles the common,
        # short-lived case without re-running anything.
        shell: pwsh
        run: |
          $maxAttempts = 4
          for ($i = 1; $i -le $maxAttempts; $i++) {
            cargo test --lib --test multiarch
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i/$maxAttempts failed (exit $LASTEXITCODE); retrying after a pause..."
            Start-Sleep -Seconds 20
          }
          exit 1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib
